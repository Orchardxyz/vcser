[package]
name = "vcser"
version = "0.1.0"
description = "Desktop app to sync extensions and settings across VS Code-based editors"
authors = ["vcser"]
edition = "2021"

[lib]
name = "vcser_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.0.0", features = [] }

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "5"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.0.0", features = [] }
which = "7"
